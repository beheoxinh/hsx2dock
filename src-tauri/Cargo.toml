[package]
name = "hsx2dock"
version = "0.3.0"
edition = "2021"
authors = ["Hsx2Coder"]
description = "Modern cross-platform Docker GUI Manager powered by Tauri v2 and React"
license = "MIT"
default-run = "hsx2dock"

[[bin]]
name = "hsx2dock"
path = "src/main.rs"

[lib]
name = "hsx2dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The MCP front-end is also built as a standalone stdio binary, so agents can
# launch it without the GUI (`hsx2dock-mcp`).
[[bin]]
name = "hsx2dock-mcp"
path = "src/mcp/bin/hsx2dock-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"

bollard = { version = "0.21", features = ["ssh"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.10"
tar = "0.4"
flate2 = "1.0"
async-channel = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "7.0"
uuid = { version = "1.27", features = ["v4", "serde"] }
toml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
libc = "0.2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
# Terminal exec output is streamed to the frontend as JSON events; base64 keeps
# arbitrary ANSI/UTF-8 bytes intact across the boundary.
base64 = "0.22"

# MCP (Model Context Protocol) front-end: agents drive the app through this.
# `server` + the stdio and streamable-HTTP transports are all we use; the macro
# crate is not needed because the tool catalogue is hand-written (see
# `src/mcp/tools.rs` for why).
rmcp = { version = "3.7", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-single-instance = "2.5.4"
