[package]
name = "docker-manager"
version = "0.2.0"
edition = "2021"
authors = ["Hsx2Coder"]
description = "A simple GUI for managing Docker resources using libadwaita and GTK4"
license = "MIT"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11", package = "gtk4" }
glib = "0.22"
gio = "0.22"
bollard = "0.21"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.10"
tar = "0.4"
flate2 = "1.0"
async-channel = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "7.0"
sysinfo = "0.39"
uuid = { version = "1.27", features = ["v4", "serde"] }
toml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
libc = "0.2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }

[build-dependencies]
glib-build-tools = "0.22"
